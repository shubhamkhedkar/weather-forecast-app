name: CD

# Builds & publishes the container image to GHCR, then promotes it through
# staging -> production. Deploy steps are PLACEHOLDERS: they do not touch any
# real infrastructure until you replace them with your own commands.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/shubhamkhedkar/weather-forecast-app

jobs:
  publish-image:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify (tests must pass before publishing)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: publish-image
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Deploy (placeholder)
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.publish-image.outputs.digest }}
        run: |
          echo "Would deploy $IMAGE_REF to STAGING"
          # --- Example A: Kubernetes (requires secret KUBE_CONFIG_STAGING) ---
          # echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          # KUBECONFIG=kubeconfig kubectl -n weather set image deployment/weather-forecast-app app="$IMAGE_REF"
          # KUBECONFIG=kubeconfig kubectl -n weather rollout status deployment/weather-forecast-app --timeout=180s
          #
          # --- Example B: SSH + docker compose (requires STAGING_SSH_KEY, STAGING_HOST) ---
          # install -m 600 /dev/null key && echo "${{ secrets.STAGING_SSH_KEY }}" > key
          # ssh -i key -o StrictHostKeyChecking=accept-new deploy@${{ secrets.STAGING_HOST }} \
          #   "docker pull $IMAGE_REF && IMAGE=$IMAGE_REF docker compose up -d"
      - name: Smoke test (placeholder)
        run: |
          echo "Would run: curl -fs \"\$STAGING_URL/actuator/health\""
          # curl -fsS --retry 10 --retry-delay 5 "${{ vars.STAGING_URL }}/actuator/health"

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [publish-image, deploy-staging]
    # Only release tags go to production; the 'production' environment
    # should be configured with required reviewers (manual approval).
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Deploy (placeholder)
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.publish-image.outputs.digest }}
        run: |
          echo "Would deploy $IMAGE_REF (version ${{ needs.publish-image.outputs.version }}) to PRODUCTION"
          # Same examples as staging, using KUBE_CONFIG_PRODUCTION / PROD_SSH_KEY / PROD_HOST secrets.
          # KUBECONFIG=kubeconfig kubectl -n weather set image deployment/weather-forecast-app app="$IMAGE_REF"
      - name: Smoke test (placeholder)
        run: |
          echo "Would run: curl -fs \"\$PRODUCTION_URL/actuator/health\""
